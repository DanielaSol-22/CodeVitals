server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API (los análisis de varios repositorios pueden tardar varios minutos)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
  location /health {
    proxy_pass http://api:8000;
  }

  # React Router: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
